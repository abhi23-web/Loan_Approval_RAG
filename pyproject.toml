[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "home-loan-rag"
version = "1.0.0"
description = "Home loan approval automation: deterministic eligibility rules with version-aware RAG policy grounding"
requires-python = ">=3.11"
readme = "README.md"

# Runtime dependencies are pinned in requirements.txt, which is the file the
# RUNBOOK installs from. They are repeated here only loosely so that
# `pip install -e .` on its own still produces a working environment.
dependencies = [
    "chromadb>=1.5,<2",
    "langsmith>=0.10,<1",
    "fastapi>=0.140,<1",
    "uvicorn[standard]>=0.40",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.10,<3",
    "streamlit>=1.55",
    "httpx>=0.28,<1",
    "pypdf>=6,<7",
    "beautifulsoup4>=4.13",
    "lxml>=6",
    "PyYAML>=6",
    "numpy>=2",
    "tenacity>=9",
    "python-dotenv>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4", "ruff>=0.9"]

[tool.setuptools.packages.find]
include = ["app*", "evaluation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ANN", "RUF"]
ignore = [
    "ANN401",  # Any is used deliberately for Chroma metadata and JSON payloads
    "E501",    # line length is enforced by the formatter, not the linter
    "B008",    # Depends() in a default is FastAPI's documented idiom
    "SIM905",  # the stop-word list is a readable block of prose, not a literal
    "RUF001",  # typographic characters appear deliberately in prose and regexes
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "S101"]
